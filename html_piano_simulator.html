<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Piano Simulator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    h1 {
      margin-bottom: 20px;
    }

    .piano {
      display: flex;
      position: relative;
      user-select: none;
    }

    .key {
      border: 1px solid #000;
      cursor: pointer;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 10px;
      font-size: 12px;
      box-sizing: border-box;
    }

    .white {
      width: 60px;
      height: 240px;
      background: #fff;
      color: #000;
      z-index: 1;
    }

    .white:active {
      background: #ddd;
    }

    .black {
      width: 40px;
      height: 150px;
      background: #000;
      color: #fff;
      position: absolute;
      top: 0;
      z-index: 2;
    }

    .black:active {
      background: #333;
    }

    /* Position black keys */
    .black.csharp { left: 45px; }
    .black.dsharp { left: 105px; }
    .black.fsharp { left: 225px; }
    .black.gsharp { left: 285px; }
    .black.asharp { left: 345px; }

    .hint {
      margin-top: 20px;
      font-size: 14px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <h1>🎹 Piano Simulator</h1>

  <div class="piano">
    <!-- White keys -->
    <div class="key white" data-note="C">C</div>
    <div class="key white" data-note="D">D</div>
    <div class="key white" data-note="E">E</div>
    <div class="key white" data-note="F">F</div>
    <div class="key white" data-note="G">G</div>
    <div class="key white" data-note="A">A</div>
    <div class="key white" data-note="B">B</div>

    <!-- Black keys -->
    <div class="key black csharp" data-note="C#"></div>
    <div class="key black dsharp" data-note="D#"></div>
    <div class="key black fsharp" data-note="F#"></div>
    <div class="key black gsharp" data-note="G#"></div>
    <div class="key black asharp" data-note="A#"></div>
  </div>

  <div class="hint">Click keys or use keyboard: A S D F G H J</div>

  <script>
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();

    const frequencies = {
      'C': 261.63,
      'C#': 277.18,
      'D': 293.66,
      'D#': 311.13,
      'E': 329.63,
      'F': 349.23,
      'F#': 369.99,
      'G': 392.00,
      'G#': 415.30,
      'A': 440.00,
      'A#': 466.16,
      'B': 493.88
    };

    function playNote(note) {
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();

      oscillator.type = 'sine';
      oscillator.frequency.value = frequencies[note];

      gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 1);

      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);

      oscillator.start();
      oscillator.stop(audioContext.currentTime + 1);
    }

    document.querySelectorAll('.key').forEach(key => {
      key.addEventListener('mousedown', () => {
        playNote(key.dataset.note);
      });
    });

    const keyMap = {
      'a': 'C',
      's': 'D',
      'd': 'E',
      'f': 'F',
      'g': 'G',
      'h': 'A',
      'j': 'B'
    };

    document.addEventListener('keydown', (e) => {
      const note = keyMap[e.key.toLowerCase()];
      if (note) playNote(note);
    });
  </script>
</body>
</html>
